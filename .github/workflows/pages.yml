name: Deploy Avatar Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: avatar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Kiem tra va chuan bi website
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s index.html ]; then
            echo "::error::Thieu index.html hoac file rong"
            exit 1
          fi

          mkdir -p _site
          cp index.html _site/index.html

          touch _site/.nojekyll

          echo "File website:"
          ls -lah _site

      - name: Cau hinh Pages
        uses: actions/configure-pages@v5

      - name: Tai website len
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Xuat ban Avatar
        id: deployment
        uses: actions/deploy-pages@v4
